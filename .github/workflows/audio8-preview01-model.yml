name: Audio8 Preview 0.1B GGUF model
on:
  push:
    branches: [audio8-npu-int4]
    paths:
      - .github/workflows/audio8-preview01-model.yml
      - scripts/build_audio8_preview01.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio8-preview01-model
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep an existing immutable model release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view audio8-preview01-q8-v1 >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            gh release download audio8-preview01-q8-v1 --pattern model-info.json --output "$RUNNER_TEMP/preview01-model-info.json"
            cat "$RUNNER_TEMP/preview01-model-info.json"
          fi
      - uses: actions/setup-python@v5
        if: steps.existing.outputs.ready != 'true'
        with:
          python-version: '3.12'
      - name: Install data-conversion-only Python dependencies
        if: steps.existing.outputs.ready != 'true'
        run: python -m pip install numpy==2.5.4 safetensors==0.6.2
      - name: Compile pinned native ggml converter and CPU smoke-test CLI
        if: steps.existing.outputs.ready != 'true'
        run: |
          bash scripts/prepare-runtime.sh
          cmake -S Audio8-Android/runtime -B "$RUNNER_TEMP/preview01-native" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=audio8_tts -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_METAL=OFF -DENGINE_ENABLE_VULKAN=OFF -DENGINE_ENABLE_LLAMAFILE=OFF -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF
          cmake --build "$RUNNER_TEMP/preview01-native" --target audiocpp_gguf audiocpp_cli -j 2
      - name: Verify official sources, convert GGUF and smoke-test native CPU output
        if: steps.existing.outputs.ready != 'true'
        run: python scripts/build_audio8_preview01.py --runtime "$PWD/Audio8-Android/runtime" --build "$RUNNER_TEMP/preview01-native" --inputs "$RUNNER_TEMP/preview01-source" --output "$RUNNER_TEMP/preview01-release"
      - name: Publish standalone model with original license and attribution
        if: steps.existing.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create audio8-preview01-q8-v1 --target "$GITHUB_SHA" --prerelease --title 'Audio8 Preview 0.1B Q8 evaluation model' --notes 'Converted from Edge0/Audio8-TTS-Preview-0.1b revision 8c837020ab800498834038363dea06757872afda using pinned native audio.cpp. Original Audio8 Community License v1.0 and attribution retained; this is not the Realistic 0.6B Apache-licensed checkpoint. Native x86 CPU smoke test only; Android output, quality and speed remain unvalidated. No Audio8 endorsement is implied.'
          gh release upload audio8-preview01-q8-v1 "$RUNNER_TEMP/preview01-release/"*
          cat "$RUNNER_TEMP/preview01-release/model-info.json"
