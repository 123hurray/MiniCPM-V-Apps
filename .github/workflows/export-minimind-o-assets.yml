name: Export MiniMind-O Android assets

on:
  workflow_dispatch:
  push:
    branches: ["text-agent-v3.1"]
    paths:
      - "tools/minimind_o/**"
      - ".github/workflows/export-minimind-o-assets.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned exporter
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "executorch==1.4.0" \
            "transformers==4.57.6" \
            "funasr==1.3.1" \
            "huggingface-hub==0.36.2" \
            "librosa==1.0.0" \
            "soundfile==0.14.0"

      - name: Download upstream checkpoints
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              "jingyaogong/minimind-3o",
              local_dir="model-cache/minimind-3o",
              allow_patterns=["config.json", "pytorch_model.bin", "tokenizer.json"],
          )
          snapshot_download("jingyaogong/Mimi", local_dir="model-cache/mimi")
          snapshot_download("jingyaogong/SenseVoiceSmall", local_dir="model-cache/SenseVoiceSmall")
          PY

      - name: Export XNNPACK dynamic-int8 models
        run: |
          mkdir -p dist
          python tools/minimind_o/export_main.py \
            --model-dir model-cache/minimind-3o \
            --output dist/minimind-o-main-int8.pte \
            --max-context 1024
          python tools/minimind_o/export_mimi.py \
            --model-dir model-cache/mimi \
            --output dist/minimind-o-mimi-int8.pte
          python tools/minimind_o/export_mimi_encoder.py \
            --model-dir model-cache/mimi \
            --output dist/minimind-o-mimi-encoder-int8.pte
          python tools/minimind_o/export_sensevoice.py \
            --sensevoice-dir model-cache/SenseVoiceSmall \
            --main-model-dir model-cache/minimind-3o \
            --output dist/minimind-o-sensevoice-int8.pte \
            --frames 256
          cp model-cache/minimind-3o/tokenizer.json dist/tokenizer.json
          cd dist
          sha256sum *.pte tokenizer.json > SHA256SUMS

      - name: Publish downloadable model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view minimind-o-android-v1 >/dev/null 2>&1 || \
            gh release create minimind-o-android-v1 \
              --title "MiniMind-O Android INT8 assets" \
              --notes "Android ExecuTorch/XNNPACK exports. Derived from jingyaogong/minimind-3o, Mimi and SenseVoiceSmall; model data is downloaded at runtime and is not bundled in the APK."
          gh release upload minimind-o-android-v1 dist/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: minimind-o-android-int8
          path: dist/
          retention-days: 30
