name: Audio8 NPU INT4 model preparation
on:
  push:
    branches: [audio8-npu-int4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio8-npu-models-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio8-npu.txt
      - name: Install conversion-only dependencies
        run: python -m pip install -r scripts/requirements-audio8-npu.txt
      - name: Test graph rewrites without an inference runtime
        run: python scripts/test_audio8_qnn_model.py
      - name: Prepare pinned Realistic INT4 graphs
        run: python scripts/build_audio8_npu_models.py --inputs "$RUNNER_TEMP/audio8-source" --output "$RUNNER_TEMP/audio8-static-models"
      - name: Verify generated artifact hashes
        working-directory: ${{ runner.temp }}/audio8-static-models
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Audio8-SM8550-static-INT4-models
          path: ${{ runner.temp }}/audio8-static-models/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Record validation boundary
        run: |
          echo '### Static model build only' >> "$GITHUB_STEP_SUMMARY"
          echo 'INT4 MatMul weights preserved; embedding lookup dequantized to FP16; fixed-capacity masked KV decode.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No ONNX Runtime/QNN inference executed. No Android NPU integration or device performance validation is claimed. No new APK is produced.' >> "$GITHUB_STEP_SUMMARY"
