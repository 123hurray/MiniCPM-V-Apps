name: Audio8 system TTS APK
on:
  push:
    branches: [audio8-system-tts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK and pinned native runtime
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          bash scripts/prepare-runtime.sh
      - name: Compile and lint TTS-only application
        working-directory: Audio8-Android
        run: bash gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Prepare unsigned signing inputs
        run: |
          mkdir -p out
          cp Audio8-Android/app/build/outputs/apk/release/app-release-unsigned.apk out/Audio8-Android-v4.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging out/Audio8-Android-v4.0-unsigned.apk | tee out/apk-metadata.txt
          grep -F "name='com.example.audio8tts' versionCode='36' versionName='4.0'" out/apk-metadata.txt
      - name: Sign only with a persistent owner-provided key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo 'No persistent signing key configured. Only unsigned inputs will be uploaded; these are not installable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          trap 'rm -f "$RUNNER_TEMP/audio8-signing.jks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/audio8-signing.jks"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 out/Audio8-Android-v4.0-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/audio8-signing.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out out/MiniCPM-V-demo-Android-v4.0.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs out/MiniCPM-V-demo-Android-v4.0.apk | tee out/signing-certificate.txt
      - name: Checksums
        run: cd out && sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Audio8-Android-v4.0
          path: out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Audio8-build-diagnostics
          path: |
            Audio8-Android/app/build/reports/
            Audio8-Android/app/.cxx/Release/*/arm64-v8a/*.txt
          if-no-files-found: ignore
