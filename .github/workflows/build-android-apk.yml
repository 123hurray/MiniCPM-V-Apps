name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MiniCPM-V-demo-Android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: MiniCPM-V-demo-Android/*.gradle.kts

      - name: Apply Android runtime overlay to llama.cpp-omni
        run: git -C llama.cpp-omni apply ../MiniCPM-V-demo-Android/patches/llama.cpp-omni-snapdragon.patch

      - name: Install Android build components
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers
          mkdir -p /tmp/minicpm-vulkan-headers/include
          cp -R /usr/include/vulkan /tmp/minicpm-vulkan-headers/include/
          cp -R /usr/include/spirv /tmp/minicpm-vulkan-headers/include/
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;4.1.2"

      - name: Run unit tests and build unsigned release APK
        working-directory: MiniCPM-V-demo-Android
        run: |
          ./gradlew --no-daemon :app:compileDebugKotlin
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Prepare signing inputs
        run: |
          cp MiniCPM-V-demo-Android/app/build/outputs/apk/release/app-release-unsigned.apk \
            MiniCPM-V-demo-Android-v3.6-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar

      - name: Verify APK metadata
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging MiniCPM-V-demo-Android-v3.6-unsigned.apk | tee /tmp/apk-badging.txt
          grep -F "package: name='com.example.minicpm_v_demo' versionCode='28' versionName='3.6'" \
            /tmp/apk-badging.txt
          unzip -t MiniCPM-V-demo-Android-v3.6-unsigned.apk
          sha256sum MiniCPM-V-demo-Android-v3.6-unsigned.apk > SHA256SUMS
          tar -czf MiniCPM-V-demo-Android-v3.6-signing-inputs.tar.gz \
            MiniCPM-V-demo-Android-v3.6-unsigned.apk apksigner.jar SHA256SUMS

      - name: Upload unsigned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-demo-Android-v3.6-signing-inputs
          path: |
            MiniCPM-V-demo-Android-v3.6-signing-inputs.tar.gz
          if-no-files-found: error
          retention-days: 30
