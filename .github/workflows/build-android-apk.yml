name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MiniCPM-V-demo-Android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: MiniCPM-V-demo-Android/*.gradle.kts

      - name: Install Android build components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;4.1.2"

      - name: Run unit tests and build debug APK
        working-directory: MiniCPM-V-demo-Android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        run: |
          cp MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk \
            MiniCPM-V-demo-Android-v2.8.apk

      - name: Verify APK metadata and signature
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging MiniCPM-V-demo-Android-v2.8.apk | tee /tmp/apk-badging.txt
          grep -F "package: name='com.example.minicpm_v_demo' versionCode='20' versionName='2.8'" \
            /tmp/apk-badging.txt
          "$APKSIGNER" verify --verbose MiniCPM-V-demo-Android-v2.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-demo-Android-v2.8
          path: MiniCPM-V-demo-Android-v2.8.apk
          if-no-files-found: error
          retention-days: 30
