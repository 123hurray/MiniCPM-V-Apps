name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MiniCPM-V-demo-Android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: MiniCPM-V-demo-Android/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;4.1.2"

      - name: Build debug APK
        working-directory: MiniCPM-V-demo-Android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp MiniCPM-V-demo-Android/app/build/outputs/apk/debug/app-debug.apk \
            MiniCPM-V-demo-Android-v2.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-demo-Android-v2.6
          path: MiniCPM-V-demo-Android-v2.6.apk
          if-no-files-found: error
          retention-days: 30
